name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS unit tests
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ResizeWindow.xcodeproj \
            -scheme ResizeWindow \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "${RUNNER_TEMP}/ResizeWindow.xcresult" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            | xcbeautify

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ runner.temp }}/ResizeWindow.xcresult
          if-no-files-found: ignore
