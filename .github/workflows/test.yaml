name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS unit tests
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ResizeWindow.xcodeproj \
            -scheme ResizeWindow \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "${RUNNER_TEMP}/ResizeWindow.xcresult" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            | xcbeautify

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: ${{ runner.temp }}/ResizeWindow.xcresult
          if-no-files-found: ignore
